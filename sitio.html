function tarjetaProd(p){return `<a class="p" href="#/producto/${esc(p.id)}"><div class="ph">${img(p.foto)?`<img src="${esc(p.foto)}" alt="" loading="lazy">`:"🛍"}</div><div class="i"><b>${esc(p.nombre)}</b><span>${money(p.precio)}</span></div></a>`}

async function enviar(ev){

function ruta(){if(PATHMODE)return decodeURIComponent(location.pathname.replace(/^\/+|\/+$/g,""));const h=location.hash.replace(/^#\/?/,"");return h||""}
function ir(r){if(PATHMODE){history.pushState(null,"","/"+r);pintar()}else location.hash="#/"+r}

async function vistaProducto(v,id){

const ESTADO={nuevo:"Recibido",preparando:"Preparando",listo:"Listo",entregado:"Entregado",cancelado:"Cancelado"};
