<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reserva tu cita</title>
<style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#18181b;--mu:#6b6b73;--bd:#dcdce0;--rd:#d7263d;--ok:#0f9d68}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2e2e33;--rd:#ff5a5f;--ok:#34d399}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:18px 0 8px}.sub{font-size:13px;color:var(--mu);margin-top:3px}
.w{max-width:560px;margin:0 auto;padding:0 16px 30px}
input,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;margin-bottom:10px}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 4px}
.lst{display:grid;gap:8px}.it{padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;display:flex;justify-content:space-between;gap:8px}.it.on{border-color:var(--rd);box-shadow:0 0 0 1px var(--rd)}
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.d{flex:none;min-width:58px;text-align:center;padding:8px 6px;border:1px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer;font-size:12px}.d b{display:block;font-size:17px}.d.on{background:var(--rd);border-color:var(--rd);color:#fff}.d.no{opacity:.35;pointer-events:none}
.hrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}.h{padding:10px 0;text-align:center;border:1px solid var(--bd);border-radius:9px;background:var(--card);cursor:pointer;font-weight:600}.h.on{background:var(--rd);border-color:var(--rd);color:#fff}
.btn{width:100%;padding:13px;border:0;border-radius:9px;background:var(--rd);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}.btn:disabled{opacity:.5}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.err{color:var(--rd);font-size:14px}.ok{color:var(--ok)}.mu{color:var(--mu);font-size:13px}.pie{text-align:center;font-size:12px;color:var(--mu);padding:14px}
</style></head><body><div id="app"><div class="w" style="padding-top:30px">Cargando…</div></div>
<script>
const API="https://rhdsbymoxllfegderalu.supabase.co/functions/v1/ventor-agenda";
const KEY="sb_publishable_p0-ZWH8XPPyC_KSTOzG9vw_OENVq8o-";
const Q=new URLSearchParams(location.search);const E=String(Q.get("e")||"").toLowerCase();
const $=s=>document.querySelector(s);const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $m=n=>"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
let D=null,S={serv:"",rec:"",fecha:"",hora:"",horas:null,nombre:"",tel:"",nota:""},msg="",busy=false,listo=null;
try{const g=JSON.parse(localStorage.getItem("vt_ag_"+E)||"{}");S.nombre=g.nombre||"";S.tel=g.tel||"";}catch(e){}
async function api(accion,d){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({accion,e:E,...d})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j;}
const sumar=(f,n)=>{const x=new Date(f+"T12:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10);};
const DN=["dom","lun","mar","mié","jue","vie","sáb"];
async function cargarHoras(){S.horas=null;S.hora="";pintar();try{const r=await api("horarios",{fecha:S.fecha,servicio:S.serv,recurso:S.rec});S.horas=r.horas;}catch(e){S.horas=[];msg=e.message;}pintar();}
function pintar(){
  const app=$("#app");
  if(!E){app.innerHTML='<div class="w" style="padding-top:30px"><h1>Falta el código del negocio en el enlace</h1></div>';return;}
  if(!D){app.innerHTML='<div class="w" style="padding-top:30px">'+(msg?'<h1>'+esc(msg)+'</h1>':'Cargando…')+'</div>';return;}
  if(listo){const c=listo.cita;const wa=String(listo.whatsapp||"").replace(/\D/g,"");const t=`Hola, reservé ${c.servicio?c.servicio+" ":""}el ${c.fecha} a las ${c.hora}${c.recurso?" con "+c.recurso:""} a nombre de ${S.nombre}.`;
    app.innerHTML=`<div class="w" style="padding-top:30px"><h1 class="ok">¡Cita reservada!</h1><p class="sub">${esc(D.empresa)} · ${esc(c.servicio||"Cita")}<br><b>${esc(c.fecha)} a las ${esc(c.hora)}</b>${c.recurso?" con "+esc(c.recurso):""}</p><p class="mu">Te contactarán para confirmarla. Si no puedes asistir, avísales.</p>${wa?`<a href="https://wa.me/${wa.length===10?"52"+wa:wa}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener"><button class="btn">Avisar por WhatsApp</button></a>`:""}<button class="btn sec" onclick="location.reload()">Hacer otra reserva</button></div>`;return;}
  const dias=[];for(let i=0;i<=Math.min(D.maxDias,30);i++){const f=sumar(D.hoy,i);const dw=new Date(f+"T12:00:00Z").getUTCDay();dias.push({f,dw,ok:D.dias.includes(dw)});}
  const sv=D.servicios.find(s=>s.nombre===S.serv);
  const puede=(!D.servicios.length||S.serv)&&S.fecha&&S.hora&&S.nombre.trim().length>1&&S.tel.replace(/\D/g,"").length>=8;
  app.innerHTML=`<header><div class="w" style="padding:0"><h1>${esc(D.empresa)}</h1><div class="sub">${esc(D.mensaje||"Reserva tu cita en línea")}</div></div></header><div class="w">
  ${D.servicios.length?`<h2>1. ¿Qué servicio?</h2><div class="lst">${D.servicios.map(s=>`<div class="it ${s.nombre===S.serv?"on":""}" data-s="${esc(s.nombre)}"><span><b>${esc(s.nombre)}</b><br><span class="mu">${s.dur} min</span></span><b>${s.precio?$m(s.precio):""}</b></div>`).join("")}</div>`:""}
  ${D.recursos.length?`<h2>${D.servicios.length?"2":"1"}. ¿Con quién?</h2><div class="lst"><div class="it ${!S.rec?"on":""}" data-r="">Cualquiera disponible</div>${D.recursos.map(r=>`<div class="it ${r===S.rec?"on":""}" data-r="${esc(r)}">${esc(r)}</div>`).join("")}</div>`:""}
  <h2>Día</h2><div class="dias">${dias.map(d=>`<div class="d ${d.f===S.fecha?"on":""} ${d.ok?"":"no"}" data-f="${d.f}">${DN[d.dw]}<b>${d.f.slice(8)}</b>${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][Number(d.f.slice(5,7))-1]}</div>`).join("")}</div>
  ${S.fecha?`<h2>Hora</h2>${S.horas===null?'<p class="mu">Buscando horarios…</p>':S.horas.length?`<div class="hrs">${S.horas.map(h=>`<div class="h ${h===S.hora?"on":""}" data-h="${h}">${h}</div>`).join("")}</div>`:'<p class="mu">No hay horarios libres este día. Prueba otro.</p>'}`:""}
  ${S.hora?`<h2>Tus datos</h2><label>Nombre</label><input id="n" value="${esc(S.nombre)}" autocomplete="name"><label>Teléfono / WhatsApp</label><input id="t" value="${esc(S.tel)}" inputmode="tel" autocomplete="tel"><label>Nota (opcional)</label><input id="o" value="${esc(S.nota)}">`:""}
  ${msg?'<p class="err">'+esc(msg)+'</p>':""}
  ${S.hora?`<button class="btn" id="ok" ${puede&&!busy?"":"disabled"}>${busy?"Reservando…":"Reservar "+S.fecha+" "+S.hora+(sv&&sv.precio?" · "+$m(sv.precio):"")}</button>`:""}
  <div class="pie">Reservas con tecnología Impulsor Ventor</div></div>`;
  app.querySelectorAll("[data-s]").forEach(x=>x.onclick=()=>{S.serv=x.dataset.s;msg="";if(S.fecha)cargarHoras();else pintar();});
  app.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{S.rec=x.dataset.r;msg="";if(S.fecha)cargarHoras();else pintar();});
  app.querySelectorAll("[data-f]").forEach(x=>x.onclick=()=>{S.fecha=x.dataset.f;msg="";cargarHoras();});
  app.querySelectorAll("[data-h]").forEach(x=>x.onclick=()=>{S.hora=x.dataset.h;msg="";pintar();});
  [["n","nombre"],["t","tel"],["o","nota"]].forEach(([id,k])=>{const el=$("#"+id);if(el)el.oninput=e=>{S[k]=e.target.value;const b=$("#ok");if(b)b.disabled=!((!D.servicios.length||S.serv)&&S.fecha&&S.hora&&S.nombre.trim().length>1&&S.tel.replace(/\D/g,"").length>=8);};});
  const ok=$("#ok");if(ok)ok.onclick=async()=>{busy=true;msg="";pintar();try{const r=await api("reservar",{fecha:S.fecha,hora:S.hora,servicio:S.serv,recurso:S.rec,nombre:S.nombre,telefono:S.tel,nota:S.nota});try{localStorage.setItem("vt_ag_"+E,JSON.stringify({nombre:S.nombre,tel:S.tel}));}catch(e){}listo=r;}catch(e){msg=e.message;if(/disponible/.test(msg))cargarHoras();}busy=false;pintar();};
}
(async()=>{if(!E){pintar();return;}try{D=await api("info",{});document.title="Reserva · "+D.empresa;}catch(e){msg=e.message;}pintar();})();
</script></body></html>
