<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contacto</title>
<style>:root{--bg:#f6f6f7;--c:#fff;--t:#111;--m:#666;--b:#e2e2e5;--a:#16a34a}@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--c:#18181b;--t:#f4f4f5;--m:#a1a1aa;--b:#2a2a2f}}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui,sans-serif}.w{max-width:480px;margin:0 auto;padding:16px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--m);font-size:13px;margin-bottom:8px}input,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--b);border-radius:10px;font:16px system-ui;background:var(--c);color:var(--t);margin:5px 0}
.btn{width:100%;padding:13px;border:0;border-radius:10px;background:var(--a);color:#fff;font-weight:700;font-size:16px;margin-top:8px}.btn:disabled{opacity:.5}.err{color:#dc2626;font-size:13.5px}.hp{position:absolute;left:-9999px}</style></head><body><div class="w" id="app">Cargando…</div>
<script>
const API="https://rhdsbymoxllfegderalu.supabase.co/functions/v1/ventor-contacto",KEY="sb_publishable_p0-ZWH8XPPyC_KSTOzG9vw_OENVq8o-";
const E=String(window.__E||new URLSearchParams(location.search).get("e")||"").toLowerCase();
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(accion,d){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify({accion,e:E,...d})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error "+r.status);return j}
(async()=>{const a=document.getElementById("app");let emp="";try{emp=(await api("lead_info",{})).empresa}catch(e){a.innerHTML='<div class="card"><h1>Página no encontrada</h1></div>';return}
a.innerHTML=`<div class="card"><h1>Contáctanos</h1><div class="sub">${esc(emp)} te responderá lo antes posible.</div>
<input id="n" placeholder="Tu nombre" autocomplete="name"><input id="c" placeholder="Correo" inputmode="email" autocomplete="email"><input id="t" placeholder="Teléfono / WhatsApp" inputmode="tel" autocomplete="tel"><input id="e" placeholder="Empresa (opcional)">
<textarea id="m" rows="4" placeholder="¿En qué te podemos ayudar?"></textarea><input class="hp" id="hp" tabindex="-1" autocomplete="off"><p class="err" id="er"></p><button class="btn" id="go">Enviar</button></div>`;
document.getElementById("go").onclick=async()=>{const b=document.getElementById("go");b.disabled=true;b.textContent="Enviando…";try{await api("lead_captura",{nombre:n.value,correo:c.value,telefono:t.value,empresa:e.value,mensaje:m.value,hp:hp.value});a.innerHTML='<div class="card"><h1>¡Gracias!</h1><p>Recibimos tu mensaje y te contactaremos pronto.</p></div>'}catch(x){document.getElementById("er").textContent=x.message;b.disabled=false;b.textContent="Enviar"}};})();
</script></body></html>
