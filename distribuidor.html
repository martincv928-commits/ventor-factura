<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de distribuidor</title><style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#18181b;--mu:#6b6b73;--bd:#dcdce0;--rd:#d7263d;--ok:#0f9d68}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--tx:#f4f4f5;--mu:#a1a1aa;--bd:#2e2e33;--rd:#ff5a5f;--ok:#34d399}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{padding:16px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:20px;margin:0}.sub{font-size:13px;color:var(--mu);margin-top:3px}
.w{max-width:760px;margin:0 auto;padding:0 16px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;margin-bottom:10px}
label{display:block;font-size:12.5px;color:var(--mu);margin:0 0 4px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}.chip{flex:none;padding:7px 13px;border-radius:20px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:13px;cursor:pointer}
.chip.on{background:var(--rd);border-color:var(--rd);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:12px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--mu)}
.ph img{width:100%;height:100%;object-fit:cover}
.pi{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.pn{font-size:14px;font-weight:600;line-height:1.25}.pp{font-size:15px;font-weight:700}
.ag{font-size:12px;color:var(--rd)}
.btn{width:100%;padding:12px;border:0;border-radius:9px;background:var(--rd);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.5}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:var(--card);border-top:1px solid var(--bd);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--card);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}.tot{font-weight:800;font-size:17px;border-top:1px solid var(--bd);margin-top:6px;padding-top:10px}
.err{color:var(--rd);font-size:14px;margin:0 0 10px}.ok{color:var(--ok);font-weight:700}
.opt{display:flex;gap:8px;margin-bottom:10px}.opt div{flex:1;padding:11px;text-align:center;border:1px solid var(--bd);border-radius:9px;cursor:pointer;font-size:14px}.opt div.on{border-color:var(--rd);color:var(--rd);font-weight:700}
.pie{text-align:center;font-size:12px;color:var(--mu);padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:10px 0}.big{font-size:28px;font-weight:800}.mu{color:var(--mu);font-size:13px}
.tabs{display:flex;gap:6px;margin:12px 0}.tabs div{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--bd);border-radius:9px;font-size:13px;cursor:pointer;background:var(--card)}.tabs div.on{background:var(--rd);color:#fff;border-color:var(--rd);font-weight:700}.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:8px}</style></head><body style="padding-bottom:20px"><div id="app"><div class="w" style="padding-top:30px">Cargando…</div></div><script>
const KEY="sb_publishable_p0-ZWH8XPPyC_KSTOzG9vw_OENVq8o-";
const money=n=>"$"+Number(n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=f=>{try{return new Date(f).toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"})}catch(e){return ""}};
const app=document.getElementById("app");const Q=new URLSearchParams(location.search);
const API="https://rhdsbymoxllfegderalu.supabase.co/functions/v1/ventor-distribuidor";
let D=null;
async function call(o){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY},body:JSON.stringify(o)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||("Error "+r.status));return j}
function login(err){app.innerHTML='<div class="w" style="padding-top:30px"><h1>Panel de distribuidor</h1><p class="sub">Impulsor · Ventor</p><div style="height:14px"></div><label>Tu código</label><input id="c" value="'+esc(Q.get("c")||"")+'" autocapitalize="none"><label>Tu PIN</label><input id="p" type="password" autocapitalize="none">'+(err?'<p class="err">'+esc(err)+'</p>':'')+'<button class="btn" onclick="entrar()">Entrar</button></div>'}
async function entrar(){const c=document.getElementById('c').value,p=document.getElementById('p').value;try{D=await call({accion:'panel',codigo:c,pin:p});try{sessionStorage.setItem('dp',JSON.stringify({c,p}))}catch(e){}pinta()}catch(e){login(e.message)}}
function pinta(){
 const h=['<header><div class="w"><h1>'+esc(D.nombre)+'</h1><div class="sub">Código: <b>'+esc(D.codigo)+'</b> · '+(D.modo==='mayorista'?'Mayorista':'Referidos')+'</div></div></header><div class="w">'];
 h.push('<div class="card"><div class="mu">Pendiente por pagarte</div><div class="big" style="color:var(--ok)">'+money(D.pendiente)+'</div><div class="mu">Generado '+money(D.generado)+' · Pagado '+money(D.pagado)+'</div><div class="mu" style="margin-top:6px">Tu porcentaje actual: <b>'+Math.round(D.tasa*100)+'%</b>'+(D.modo==='mayorista'?(D.mayoreoOk?' (descuento mayorista activo)':' · te faltan '+Math.max(0,D.minMayoreo-D.activas)+' empresas activas para el 30%'):'')+'</div></div>');
 h.push('<div class="card"><b>Tu código para registrar clientes</b><div class="big" style="font-size:22px">'+esc(D.codigo)+'</div><div class="mu">Tus clientes lo escriben al crear su cuenta en Ventor ("Código de distribuidor").</div><button class="btn sec sm" style="margin-top:8px" onclick="navigator.clipboard&&navigator.clipboard.writeText(\''+esc(D.codigo)+'\');this.textContent=\'Copiado\'">Copiar código</button></div>');
 h.push('<h3>Mis empresas ('+D.activas+' activas de '+D.empresas.length+')</h3>');
 if(!D.empresas.length)h.push('<div class="card mu">Aún no tienes empresas registradas con tu código.</div>');
 D.empresas.forEach(e=>h.push('<div class="card"><div class="row"><b>'+esc(e.nombre)+'</b><span class="'+(e.vigente?'ok':'err')+'">'+(e.vigente?'Activa':'Vencida')+'</span></div><div class="mu">Plan '+esc(e.plan||'')+(e.vence_en?' · vence '+fd(e.vence_en):'')+' · cobrado '+money(e.pagado)+'</div></div>'));
 if(D.meses.length)h.push('<h3>Por mes</h3><div class="card">'+D.meses.map(m=>'<div class="row"><span>'+esc(m.mes)+'</span><span>cobrado '+money(m.cobrado)+' → <b>'+money(m.comision)+'</b></span></div>').join('')+'</div>');
 if(D.pagos.length)h.push('<h3>Pagos recibidos</h3><div class="card">'+D.pagos.map(p=>'<div class="row"><span>'+fd(p.pagado_en)+(p.nota?' · '+esc(p.nota):'')+'</span><b>'+money(p.monto)+'</b></div>').join('')+'</div>');
 h.push('<div class="pie">Las comisiones se pagan manualmente cada mes.</div></div>');
 app.innerHTML=h.join('');
}
(async()=>{try{const s=JSON.parse(sessionStorage.getItem('dp')||'null');if(s){D=await call({accion:'panel',codigo:s.c,pin:s.p});return pinta()}}catch(e){}login('')})();

</script></body></html>
